<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auth panel · A · Cinematic</title>
<style>
  :root{
    --accent:#1f4e3d; --accent-dark:#163a2d; --highlight:#b08d57; --highlight-light:#f4ecdd;
    --sidebar:#16241d; --bg:#ffffff; --bg-alt:#faf8f4; --text:#1c1a17;
    --text-secondary:#57514a; --text-muted:#9a9288; --border:#e7e1d7;
    --stext:rgba(255,255,255,.62); --sactive:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Libre Franklin',-apple-system,Segoe UI,sans-serif;color:var(--text);}
  .serif{font-family:'Fraunces','Playfair Display',Georgia,serif;font-weight:300;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .split{display:grid;grid-template-columns:1.05fr 0.95fr;height:100vh;}

  /* ---------- LEFT: cinematic ---------- */
  .brand{position:relative;overflow:hidden;background:var(--sidebar);
    display:flex;flex-direction:column;justify-content:space-between;padding:48px;}

  /* crossfading ken-burns carousel */
  .stage{position:absolute;inset:0;}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
    animation:xfade 28s infinite;transform-origin:center;}
  .stage img:nth-child(1){animation-delay:0s;}
  .stage img:nth-child(2){animation-delay:7s;}
  .stage img:nth-child(3){animation-delay:14s;}
  .stage img:nth-child(4){animation-delay:21s;}
  @keyframes xfade{
    0%   {opacity:0;transform:scale(1.02);}
    4%   {opacity:.9;}
    21%  {opacity:.9;}
    25%  {opacity:0;transform:scale(1.12);}
    100% {opacity:0;transform:scale(1.12);}
  }
  .scrim{position:absolute;inset:0;background:
    linear-gradient(120deg,rgba(22,36,29,.92) 0%,rgba(22,36,29,.6) 55%,rgba(22,36,29,.35) 100%);}

  /* drifting aurora blobs */
  .aurora{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;mix-blend-mode:screen;}
  .a1{width:460px;height:460px;background:rgba(176,141,87,.34);top:-120px;left:-100px;animation:drift1 16s ease-in-out infinite;}
  .a2{width:400px;height:400px;background:rgba(31,78,61,.55);bottom:-120px;right:-80px;animation:drift2 20s ease-in-out infinite;}
  .a3{width:280px;height:280px;background:rgba(176,141,87,.22);top:40%;left:55%;animation:drift3 14s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1);opacity:.8;}50%{transform:translate(60px,80px) scale(1.2);opacity:1;}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1);opacity:.7;}50%{transform:translate(-70px,-50px) scale(1);opacity:1;}}
  @keyframes drift3{0%,100%{transform:translate(0,0);opacity:.5;}50%{transform:translate(-40px,30px);opacity:.85;}}

  /* fine grain */
  .grain{position:absolute;inset:0;opacity:.06;pointer-events:none;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;}

  .content{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;height:100%;}
  .mark{display:inline-flex;align-items:center;gap:10px;opacity:0;animation:up .8s .1s forwards;}
  .mark .box{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;}
  .mark .wm{font-family:'Fraunces',serif;font-weight:300;font-size:20px;color:#fff;}

  .headline .eyebrow{color:var(--highlight-light);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    opacity:0;animation:up .8s .3s forwards;}
  .headline h1{color:#fff;font-size:52px;line-height:1.06;letter-spacing:-.02em;margin-top:18px;max-width:15ch;}
  .headline h1 span{display:inline-block;opacity:0;transform:translateY(24px);animation:up .9s forwards;}
  .headline h1 span:nth-child(1){animation-delay:.45s;}
  .headline h1 span:nth-child(2){animation-delay:.58s;}
  .headline h1 span:nth-child(3){animation-delay:.71s;}
  .headline h1 span:nth-child(4){animation-delay:.84s;}
  .headline h1 .ital{font-style:italic;color:var(--highlight);}

  /* rotating testimonial */
  .rot{position:relative;height:96px;margin-top:6px;opacity:0;animation:up .8s 1s forwards;}
  .rot figure{position:absolute;inset:0;opacity:0;animation:quote 18s infinite;border-left:2px solid rgba(176,141,87,.5);padding-left:16px;}
  .rot figure:nth-child(1){animation-delay:0s;}
  .rot figure:nth-child(2){animation-delay:6s;}
  .rot figure:nth-child(3){animation-delay:12s;}
  .rot blockquote{font-family:'Fraunces',serif;font-weight:300;font-size:17px;line-height:1.5;color:#fff;}
  .rot figcaption{margin-top:8px;font-size:12px;color:var(--stext);}
  .rot figcaption b{color:#fff;font-weight:500;}
  @keyframes quote{0%{opacity:0;transform:translateY(8px);}5%{opacity:1;transform:none;}28%{opacity:1;}33%{opacity:0;}100%{opacity:0;}}

  /* progress dots */
  .dots{display:flex;gap:7px;margin-top:22px;opacity:0;animation:up .8s 1.1s forwards;}
  .dots i{width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden;position:relative;}
  .dots i::after{content:"";position:absolute;inset:0;background:var(--highlight);transform:scaleX(0);transform-origin:left;}
  .dots i:nth-child(1)::after{animation:fill 7s linear infinite;}
  .dots i:nth-child(2)::after{animation:fill 7s linear infinite 7s;}
  .dots i:nth-child(3)::after{animation:fill 7s linear infinite 14s;}
  .dots i:nth-child(4)::after{animation:fill 7s linear infinite 21s;}
  @keyframes fill{0%{transform:scaleX(0);}90%{transform:scaleX(1);}100%{transform:scaleX(1);}}

  @keyframes up{to{opacity:1;transform:none;}}

  /* ---------- RIGHT: form (static context) ---------- */
  .form{display:flex;flex-direction:column;justify-content:center;padding:56px;background:var(--bg);}
  .col{max-width:340px;margin:0 auto;width:100%;}
  .col .eb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);}
  .col h2{font-size:28px;margin:8px 0 6px;}
  .col p.s{color:var(--text-secondary);font-size:14px;margin-bottom:22px;}
  .grp{border:1px solid var(--border);border-radius:12px;background:var(--bg-alt);overflow:hidden;}
  .fld{padding:9px 14px;}.fld+.fld{border-top:1px solid #f1ece4;}
  .fld label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
  .fld input{width:100%;border:0;background:transparent;font-size:14px;padding:2px 0;outline:none;color:var(--text);}
  .cta{margin-top:16px;width:100%;height:40px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:500;cursor:pointer;}
  .foot{margin-top:22px;font-size:12px;color:var(--text-secondary);text-align:center;}
  .foot a{color:var(--accent);font-weight:500;}
  @media(max-width:820px){.split{grid-template-columns:1fr;}.brand{display:none;}}
</style>
</head>
<body>
<div class="split">
  <aside class="brand">
    <div class="stage">
      <img src="https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=1400&q=80" alt="">
      <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=1400&q=80" alt="">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1400&q=80" alt="">
      <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1400&q=80" alt="">
    </div>
    <div class="scrim"></div>
    <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
    <div class="grain"></div>

    <div class="content">
      <div class="mark"><span class="box">LRE</span><span class="wm">Luxury RE</span></div>
      <div>
        <div class="headline">
          <span class="eyebrow mono">Members' Entrance</span>
          <h1 class="serif"><span>Where&nbsp;</span><span>extraordinary&nbsp;</span><span>homes&nbsp;</span><span class="ital">find&nbsp;their&nbsp;owners.</span></h1>
        </div>
        <div class="rot">
          <figure><blockquote>&ldquo;Every home felt genuinely curated — not a listings feed.&rdquo;</blockquote><figcaption><b>Anthony Sterling</b> · Sterling &amp; Co.</figcaption></figure>
          <figure><blockquote>&ldquo;Discretion at every step. The Canyon House was ours in a week.&rdquo;</blockquote><figcaption><b>Elena Voss</b> · Private Client</figcaption></figure>
          <figure><blockquote>&ldquo;A quiet, considered process. Exactly how it should feel.&rdquo;</blockquote><figcaption><b>M. Laurent</b> · Bel Air</figcaption></figure>
        </div>
        <div class="dots"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
  </aside>

  <main class="form">
    <div class="col">
      <p class="eb mono">Member Access</p>
      <h2 class="serif">Welcome back</h2>
      <p class="s">Sign in to your account</p>
      <div class="grp">
        <div class="fld"><label>Email</label><input value="anthony@sterling.co"></div>
        <div class="fld"><label>Password</label><input type="password" value="••••••••••"></div>
      </div>
      <button class="cta">Sign In</button>
      <p class="foot">New to Luxury RE? <a href="#">Create an account</a></p>
    </div>
  </main>
</div>
</body>
</html>
