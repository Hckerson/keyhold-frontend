<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auth panel · B · Aurora mesh</title>
<style>
  :root{
    --accent:#1f4e3d; --accent-dark:#163a2d; --highlight:#b08d57; --highlight-light:#f4ecdd;
    --sidebar:#16241d; --bg:#ffffff; --bg-alt:#faf8f4; --text:#1c1a17;
    --text-secondary:#57514a; --text-muted:#9a9288; --border:#e7e1d7;
    --stext:rgba(255,255,255,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Libre Franklin',-apple-system,Segoe UI,sans-serif;color:var(--text);}
  .serif{font-family:'Fraunces','Playfair Display',Georgia,serif;font-weight:300;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .split{display:grid;grid-template-columns:1.05fr 0.95fr;height:100vh;}

  /* ---------- LEFT: aurora mesh ---------- */
  .brand{position:relative;overflow:hidden;background:#0f1a15;
    display:flex;flex-direction:column;justify-content:space-between;padding:48px;}

  /* flowing gradient blobs = living mesh */
  .mesh{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
  .m1{width:520px;height:520px;background:var(--accent);top:-140px;left:-120px;animation:flow1 22s ease-in-out infinite;}
  .m2{width:460px;height:460px;background:var(--highlight);bottom:-160px;right:-120px;opacity:.5;animation:flow2 26s ease-in-out infinite;}
  .m3{width:380px;height:380px;background:#2f6b52;top:30%;left:40%;opacity:.6;animation:flow3 18s ease-in-out infinite;}
  .m4{width:300px;height:300px;background:var(--highlight-light);opacity:.14;top:60%;left:10%;animation:flow1 20s ease-in-out infinite reverse;}
  @keyframes flow1{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(120px,60px) scale(1.15);}66%{transform:translate(40px,120px) scale(.95);}}
  @keyframes flow2{0%,100%{transform:translate(0,0) scale(1.1);}50%{transform:translate(-120px,-80px) scale(1);}}
  @keyframes flow3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-90px,60px) scale(1.2);}}

  /* conic shimmer sweep */
  .sweep{position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(176,141,87,.06) 40deg,transparent 90deg);animation:spin 24s linear infinite;pointer-events:none;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* floating glass cards */
  .glass{position:absolute;border-radius:16px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.5);padding:16px 18px;color:#fff;}
  .g1{top:16%;right:12%;width:190px;animation:float 9s ease-in-out infinite;}
  .g2{bottom:20%;right:22%;width:170px;animation:float 11s ease-in-out infinite 1.5s;}
  .glass .k{font-family:'Fraunces',serif;font-size:26px;}
  .glass .k .u{font-style:italic;color:var(--highlight-light);}
  .glass .l{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stext);margin-top:5px;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-16px) rotate(1deg);}}

  .grain{position:absolute;inset:0;opacity:.05;pointer-events:none;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;}

  .content{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:space-between;height:100%;}
  .mark{display:inline-flex;align-items:center;gap:10px;opacity:0;animation:up .8s .1s forwards;}
  .mark .box{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;}
  .mark .wm{font-family:'Fraunces',serif;font-weight:300;font-size:20px;color:#fff;}

  .eyebrow{color:var(--highlight-light);font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:0;animation:up .8s .3s forwards;}
  h1{color:#fff;font-size:54px;line-height:1.05;letter-spacing:-.02em;margin-top:18px;max-width:14ch;}
  h1 span{display:inline-block;opacity:0;transform:translateY(24px);animation:up .9s forwards;}
  h1 span:nth-child(1){animation-delay:.45s;} h1 span:nth-child(2){animation-delay:.6s;} h1 span:nth-child(3){animation-delay:.75s;}
  h1 .ital{font-style:italic;color:var(--highlight);}
  .lede{color:var(--stext);font-size:16px;line-height:1.6;max-width:34ch;margin-top:20px;opacity:0;animation:up .8s 1s forwards;}
  @keyframes up{to{opacity:1;transform:none;}}

  /* ---------- RIGHT ---------- */
  .form{display:flex;flex-direction:column;justify-content:center;padding:56px;background:var(--bg);}
  .col{max-width:340px;margin:0 auto;width:100%;}
  .col .eb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);}
  .col h2{font-size:28px;margin:8px 0 6px;}
  .col p.s{color:var(--text-secondary);font-size:14px;margin-bottom:22px;}
  .grp{border:1px solid var(--border);border-radius:12px;background:var(--bg-alt);overflow:hidden;}
  .fld{padding:9px 14px;}.fld+.fld{border-top:1px solid #f1ece4;}
  .fld label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
  .fld input{width:100%;border:0;background:transparent;font-size:14px;padding:2px 0;outline:none;color:var(--text);}
  .cta{margin-top:16px;width:100%;height:40px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:500;cursor:pointer;}
  .foot{margin-top:22px;font-size:12px;color:var(--text-secondary);text-align:center;}
  .foot a{color:var(--accent);font-weight:500;}
  @media(max-width:820px){.split{grid-template-columns:1fr;}.brand{display:none;}}
</style>
</head>
<body>
<div class="split">
  <aside class="brand">
    <div class="mesh m1"></div><div class="mesh m2"></div><div class="mesh m3"></div><div class="mesh m4"></div>
    <div class="sweep"></div>
    <div class="grain"></div>

    <div class="glass g1"><div class="k">$8.5<span class="u">B</span></div><div class="l">In sales closed</div></div>
    <div class="glass g2"><div class="k">2,500<span class="u">+</span></div><div class="l">Curated listings</div></div>

    <div class="content">
      <div class="mark"><span class="box">LRE</span><span class="wm">Luxury RE</span></div>
      <div>
        <span class="eyebrow mono">Members' Entrance</span>
        <h1 class="serif"><span>A&nbsp;private&nbsp;</span><span>marketplace&nbsp;for&nbsp;</span><span class="ital">extraordinary&nbsp;homes.</span></h1>
        <p class="lede">Off-market estates and architectural landmarks, presented with discretion.</p>
      </div>
      <div></div>
    </div>
  </aside>

  <main class="form">
    <div class="col">
      <p class="eb mono">Member Access</p>
      <h2 class="serif">Welcome back</h2>
      <p class="s">Sign in to your account</p>
      <div class="grp">
        <div class="fld"><label>Email</label><input value="anthony@sterling.co"></div>
        <div class="fld"><label>Password</label><input type="password" value="••••••••••"></div>
      </div>
      <button class="cta">Sign In</button>
      <p class="foot">New to Luxury RE? <a href="#">Create an account</a></p>
    </div>
  </main>
</div>
</body>
</html>
